[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celery-framework"
version = "1.0.0"
description = "Simple Celery task management framework"
requires-python = ">=3.10"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.0.1",
    "omegaconf>=2.3.0",
    "flower>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
